<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490" role="img" aria-label="impatient-programming technical architecture">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.65"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FB7185"/>
    </marker>
  </defs>
  <rect width="1040" height="490" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>
  <rect width="1040" height="490" rx="14" fill="url(#grid)"/>
  <text x="28" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#F8FAFC">impatient-programming  //  TECHNICAL ARCHITECTURE &amp; INVARIANT BOUNDARIES</text>
  <text x="28" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Three normative texts guarded by a 20-test Rust pin suite and zero-drift codepoint scanner.</text>
  <line x1="28" y1="72" x2="1012" y2="72" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="28" y="94" width="290" height="182" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="42" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">1. Three Normative Documents</text>
  <text x="42" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">MANIFESTO.md : Ten principles in</text>
  <text x="42" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  working-day encounter order</text>
  <text x="42" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">PRACTICE.md  : Concrete lane mechanics,</text>
  <text x="42" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  dated front page, counts nothing</text>
  <text x="42" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">README.md    : Method overview +</text>
  <text x="42" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  live 10-repo Retrospective Line</text>
  <text x="42" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  round states</text>
  <rect x="364" y="94" width="320" height="182" rx="10" fill="#2D0B14" stroke="#FB7185" stroke-width="1.8"/>
  <text x="378" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#FB7185">2. Executable Contract Guard</text>
  <text x="378" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">CONTRACT.md (IP-1 through IP-266)</text>
  <text x="378" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">scripts/codepoint_scan.py (skips</text>
  <text x="378" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  .git, target, .venv, node_modules)</text>
  <text x="378" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">tests/test_documents.rs (13 pins):</text>
  <text x="378" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  - IP-2: 16 raw+NFKC colon/dash ban</text>
  <text x="378" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  - IP-13: zero product code in tree</text>
  <text x="378" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">tests/test_practice.rs (7 pins)</text>
  <rect x="730" y="94" width="282" height="182" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="744" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">3. Closed-Round Discipline</text>
  <text x="744" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">1. Contract obligation first</text>
  <text x="744" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">2. Failing test kills drift</text>
  <text x="744" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">3. Implementation + local gate</text>
  <text x="744" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">4. Three independent reviews:</text>
  <text x="744" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">   spec, standards, red-team</text>
  <text x="744" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">5. Human judgment &amp; closure</text>
  <line x1="318" y1="184" x2="362" y2="184" stroke="#FB7185" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="684" y1="184" x2="728" y2="184" stroke="#FB7185" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="28" y="304" width="984" height="156" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="42" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">4. Portfolio Feedback Loop (Nine Sibling Tools Governed by These Ten Principles)</text>
  <text x="42" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Capture &amp; Memory : flighttape (run tapes)  |  onrecord (claim store)  |  tetlock (pre-action confessions)  |  muda (rework billing)</text>
  <text x="42" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Rule Diagnosis   : unheard (obedience counts)  -&gt;  bluepencil (evidence-backed rules diff)  |  retroforge (setup hunks)</text>
  <text x="42" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Change Verdict   : secondtake (matched before/after setup evaluation)  -&gt;  touchstone (keep / kill / rerun experiment registry)</text>
  <text x="42" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Every sibling README reports closed rounds under IP-5; batched refresh rounds re-pin sibling states inside test_documents.rs.</text>
</svg>
